name: CI/CD Pipeline - NEMON Energy Indexing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Integración Continua (Ejecutar Tests Automatizados)
  # -------------------------------------------------------------
  test-backend:
    name: 🧪 Ejecutar Tests de Backend (PHP 8.4)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: nemon_energy_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar entono PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, bcmath, mbstring
          coverage: none

      - name: 📦 Instalar dependencias de Composer
        run: |
          cd backend
          composer install --prefer-dist --no-progress --no-interaction

      - name: 🔑 Configurar variables de test
        run: |
          cd backend
          cp .env.example .env
          php artisan key:generate

      - name: 🧪 Ejecutar PHPUnit / Pest Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: nemon_energy_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          cd backend
          php artisan test

  # -------------------------------------------------------------
  # Job 2: Despliegue Continuo (Build de Contenedores Docker)
  # -------------------------------------------------------------
  build-and-deploy:
    name: 🐳 Compilar y Construir Contenedores Docker
    needs: test-backend
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🛠️ Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🚀 Validar y Compilar Docker Compose (Multi-contenedor)
        run: |
          docker compose build

      - name: 🔍 Verificar imágenes construidas
        run: |
          docker images

      # ----------------------------------------------------------------------
      # Despliegue automático a servidor remoto VPS mediante SSH
      # Requiere configurar Secrets en GitHub (SERVER_HOST, SERVER_USER, SERVER_SSH_KEY)
      # ----------------------------------------------------------------------
      - name: 🌐 Desplegar en servidor remoto (VPS)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/nemon
            git pull origin main
            docker compose down
            docker compose up --build -d
